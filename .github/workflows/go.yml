name: Go

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test ./...
      # The contract has no dependencies, on purpose: importing it must
      # never pull anything into a client's or the site's build.
      - run: |
          deps=$(go list -deps . | grep '\.' | grep -v '^github.com/OptionsBoss/boss-api$' || true)
          test -z "$deps" || { echo "$deps"; exit 1; }
